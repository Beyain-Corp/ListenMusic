# ListenMusic on any machine with Docker: docker compose up -d, then open http://<this machine>:4180
services:
  listenmusic:
    image: ghcr.io/ernani1234/listenmusic:latest
    # Or build it from this folder instead:
    # build: .
    container_name: listenmusic
    ports:
      - "4180:4180"
    volumes:
      - listenmusic-data:/data # library: playlists, favorites, history
      - listenmusic-cache:/cache # HD videos already downloaded
    environment:
      # Optional, see the README: cookies for YouTube's bot checks, region for search results, auth token.
      # YTDLP_EXTRA_ARGS: "--cookies /data/cookies.txt"
      # LISTENMUSIC_LOCATION: "US"
      # LISTENMUSIC_AUTH_TOKEN: "your-secret-token"
      LISTENMUSIC_CACHE_MAX_MB: "2048"
    restart: unless-stopped

volumes:
  listenmusic-data:
  listenmusic-cache:
